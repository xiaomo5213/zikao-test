<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#f3f5f9">
  <title>完形补文 · 真题演练（2013-2026）</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background-color: #f3f5f9;
      padding: 16px;
      padding-top: calc(16px + env(safe-area-inset-top));
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #1e293b;
      line-height: 1.6;
    }

    .app-container {
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .header {
      margin-bottom: 16px;
      text-align: center;
    }

    .header h1 {
      font-size: 1.5rem;
      color: #1e293b;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .header p {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 6px;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04), 0 2px 4px rgba(0, 0, 0, 0.02);
      padding: 20px 16px;
      margin-bottom: 16px;
      transition: all 0.2s;
    }

    .exam-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .exam-title span {
      background: #3b82f6;
      color: white;
      font-size: 0.7rem;
      padding: 3px 10px;
      border-radius: 30px;
      font-weight: 500;
    }

    .exam-title .translate-btn {
      margin-left: auto;
      background: #10b981;
      color: white;
      border: none;
      font-size: 0.85rem;
      padding: 8px 16px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 36px;
      user-select: none;
    }

    .exam-title .translate-btn:hover {
      background: #059669;
    }

    .exam-title .translate-btn.active {
      background: #f59e0b;
    }

    .exam-title .translate-btn.active:hover {
      background: #d97706;
    }

    .passage {
      font-size: 1rem;
      line-height: 1.9;
      color: #1e293b;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .passage p {
      margin-bottom: 16px;
      text-align: justify;
    }

    .sentence-block {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px dashed #e2e8f0;
    }

    .sentence-block:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .sentence-en {
      text-align: justify;
      margin-bottom: 8px;
      font-size: 1rem;
      line-height: 1.9;
      color: #0f172a;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .speak-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      margin-left: 6px;
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 50%;
      border: 1px solid #dbeafe;
      background: #eff6ff;
      color: #2563eb;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      padding: 0;
      line-height: 1;
    }

    .speak-btn:hover {
      background: #dbeafe;
      border-color: #93c5fd;
    }

    .speak-btn:active {
      transform: scale(0.9);
      background: #bfdbfe;
    }

    .speak-btn.speaking {
      background: #3b82f6;
      color: white;
      border-color: #3b82f6;
      animation: pulse 1.2s ease-in-out infinite;
    }

    .speak-btn.unsupported {
      opacity: 0.4;
      cursor: not-allowed;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .sentence-zh {
      color: #475569;
      font-size: 0.9rem;
      line-height: 1.7;
      padding: 10px 14px;
      border-left: 3px solid #10b981;
      background: #f0fdf4;
      border-radius: 6px;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .hint-word {
      text-decoration: underline;
      font-style: italic;
      color: #475569;
    }

    .filled-answer {
      color: #dc2626;
      font-weight: 700;
      background: #fef2f2;
      padding: 0 4px;
      border-radius: 4px;
    }

    .blank-input {
      display: inline-block;
      width: auto;
      min-width: 76px;
      max-width: 220px;
      padding: 6px 10px;
      margin: 0 3px;
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 500;
      color: #2563eb;
      background: #f1f5f9;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      text-align: center;
      outline: none;
      transition: all 0.2s;
      cursor: pointer;
      vertical-align: middle;
      field-sizing: content;
      -webkit-appearance: none;
      appearance: none;
    }

    .blank-input::placeholder {
      color: #94a3b8;
      font-weight: 400;
      opacity: 0.8;
    }

    .blank-input:hover {
      border-color: #3b82f6;
      background: #e2e8f0;
    }

    .blank-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      background: #ffffff;
    }

    .blank-input.revealed {
      background: #dbeafe;
      border-color: #3b82f6;
      color: #1e40af;
      font-weight: 600;
      cursor: pointer;
      field-sizing: content;
    }

    .blank-input.revealed::placeholder {
      color: #1e40af;
      opacity: 1;
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .btn {
      background: white;
      border: 1px solid #cbd5e1;
      padding: 12px 16px;
      border-radius: 40px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #1e293b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      flex: 1;
      min-width: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      min-height: 46px;
    }

    .btn:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.4;
      pointer-events: none;
      filter: grayscale(0.5);
    }

    .btn-reset {
      background: #fef2f2;
      border-color: #fca5a5;
      color: #b91c1c;
      flex: 0 0 auto;
      min-width: 90px;
    }

    .btn-reset:hover {
      background: #fee2e2;
      border-color: #ef4444;
    }

    .page-indicator {
      font-size: 0.85rem;
      color: #475569;
      background: #e2e8f0;
      padding: 10px 14px;
      border-radius: 40px;
      font-weight: 500;
      white-space: nowrap;
      text-align: center;
      min-width: 70px;
      order: 3;
      flex: 1 1 100%;
    }

    /* 弹窗遮罩 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s, visibility 0.2s;
    }

    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .modal-content {
      background: white;
      border-radius: 24px;
      max-width: 500px;
      width: 100%;
      padding: 24px 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      position: relative;
      transform: scale(0.96);
      transition: transform 0.2s;
      max-height: 80vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-header h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.8rem;
      line-height: 1;
      color: #94a3b8;
      cursor: pointer;
      padding: 0 8px;
      transition: color 0.2s;
      min-width: 40px;
      min-height: 40px;
    }

    .modal-close:hover {
      color: #1e293b;
    }

    .modal-answer {
      font-size: 1.8rem;
      font-weight: 700;
      color: #2563eb;
      margin: 10px 0 16px;
      letter-spacing: 0.5px;
      word-break: break-word;
    }

    .modal-explanation {
      background: #f8fafc;
      padding: 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.7;
      color: #1e293b;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ========= 推广弹窗样式 ========= */
    .promo-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 20px;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.25s, visibility 0.25s;
    }

    .promo-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .promo-content {
      background: #ffffff;
      border-radius: 24px;
      max-width: 380px;
      width: 100%;
      padding: 28px 22px 22px;
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.35);
      position: relative;
      transform: scale(0.92);
      transition: transform 0.25s;
      text-align: center;
    }

    .promo-overlay.active .promo-content {
      transform: scale(1);
    }

    .promo-close {
      position: absolute;
      top: 10px;
      right: 12px;
      background: rgba(148, 163, 184, 0.15);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.4rem;
      line-height: 1;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .promo-close:hover {
      background: rgba(148, 163, 184, 0.3);
      color: #1e293b;
    }

    .promo-close:active {
      transform: scale(0.9);
    }

    .promo-badge {
      display: inline-block;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: white;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 30px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .promo-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .promo-desc {
      font-size: 0.9rem;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .promo-desc strong {
      color: #dc2626;
      font-weight: 700;
    }

    .promo-qrcode-wrap {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .promo-qrcode {
      display: block;
      width: 100%;
      max-width: 220px;
      height: auto;
      border-radius: 10px;
    }

    .promo-qrcode-fallback {
      width: 100%;
      max-width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 0.85rem;
      background: #f1f5f9;
      border-radius: 10px;
      text-align: center;
      padding: 20px;
    }

    .promo-tips {
      font-size: 0.8rem;
      color: #64748b;
      background: #eff6ff;
      border-radius: 10px;
      padding: 10px 14px;
      line-height: 1.6;
      text-align: left;
      border-left: 3px solid #3b82f6;
    }

    .promo-tips strong {
      color: #2563eb;
    }

    .footer-note {
      text-align: center;
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 8px;
      padding: 8px 0;
    }

    /* 手机端适配 */
    @media (max-width: 480px) {
      body {
        padding: 12px;
        padding-top: calc(12px + env(safe-area-inset-top));
        padding-bottom: calc(12px + env(safe-area-inset-bottom));
      }

      .header h1 {
        font-size: 1.3rem;
      }

      .header p {
        font-size: 0.8rem;
      }

      .card {
        padding: 16px 12px;
        border-radius: 16px;
      }

      .exam-title {
        font-size: 1rem;
        gap: 6px;
      }

      .exam-title .translate-btn {
        font-size: 0.8rem;
        padding: 7px 14px;
        min-height: 34px;
      }

      .passage {
        font-size: 0.95rem;
        line-height: 1.85;
      }

      .sentence-en {
        font-size: 0.95rem;
        line-height: 1.85;
      }

      .sentence-zh {
        font-size: 0.87rem;
        padding: 9px 12px;
      }

      .blank-input {
        min-width: 64px;
        max-width: 180px;
        padding: 5px 8px;
        font-size: 0.9rem;
      }

      .speak-btn {
        width: 28px;
        height: 28px;
        min-width: 28px;
        font-size: 0.85rem;
        margin-left: 4px;
      }

      .btn {
        padding: 10px 14px;
        font-size: 0.9rem;
        min-height: 44px;
      }

      .btn-reset {
        min-width: 80px;
      }

      .page-indicator {
        font-size: 0.8rem;
        padding: 8px 12px;
      }

      .modal-content {
        padding: 20px 16px;
      }

      .modal-answer {
        font-size: 1.5rem;
      }

      .modal-explanation {
        font-size: 0.9rem;
        padding: 14px;
      }

      .promo-content {
        padding: 24px 18px 18px;
        border-radius: 20px;
      }

      .promo-title {
        font-size: 1.15rem;
      }

      .promo-desc {
        font-size: 0.85rem;
      }

      .promo-qrcode {
        max-width: 200px;
      }

      .promo-qrcode-fallback {
        max-width: 200px;
        height: 200px;
      }

      .promo-tips {
        font-size: 0.75rem;
        padding: 9px 12px;
      }
    }

    /* 超窄屏 */
    @media (max-width: 360px) {
      .exam-title .translate-btn {
        margin-left: 0;
        width: 100%;
        justify-content: center;
        margin-top: 8px;
      }

      .nav-buttons {
        flex-direction: column;
      }

      .btn, .btn-reset {
        width: 100%;
        max-width: none;
      }
    }
  </style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>📘 完形补文 · 真题演练</h1>
    <p>点击输入框查看答案 · 点击翻译显示中文 · 点击 🔊 朗读英文</p>
  </div>

  <div id="quizCard" class="card">
    <!-- 动态渲染试卷内容 -->
  </div>

  <div class="nav-buttons">
    <button id="prevBtn" class="btn" disabled>← 上一页</button>
    <button id="resetBtn" class="btn btn-reset">↺ 重置</button>
    <span id="pageIndicator" class="page-indicator">1 / 26</span>
    <button id="nextBtn" class="btn">下一页 →</button>
  </div>
  <div class="footer-note">基于2013-2026年自考英语(二)完形补文真题</div>
</div>

<!-- 答案解析弹窗 -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h3>💡 答案解析</h3>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-answer" id="modalAnswer">answer</div>
    <div class="modal-explanation" id="modalExplanation">解析内容</div>
  </div>
</div>

<!-- 推广弹窗 -->
<div id="promoOverlay" class="promo-overlay">
  <div class="promo-content">
    <button class="promo-close" id="promoClose" aria-label="关闭">&times;</button>
    <div class="promo-badge">限时优惠</div>
    <h3 class="promo-title">获取电子版资料</h3>
    <p class="promo-desc">扫码在淘宝购买，<strong>一次购买，永久免费更新</strong>！</p>
    <div class="promo-qrcode-wrap">
      <img src="12.jpg" alt="淘宝购买二维码" class="promo-qrcode" id="promoQrcode"
           onerror="this.style.display='none'; document.getElementById('promoQrcodeFallback').style.display='flex';">
      <div class="promo-qrcode-fallback" id="promoQrcodeFallback" style="display:none;">
        二维码图片加载失败<br>请检查 12.jpg 是否已上传
      </div>
    </div>
    <div class="promo-tips">
      <strong>📦 包含内容：</strong>全部真题 PDF、完形补文详解、答题技巧整理。<br>
      <strong>💡 购买方式：</strong>打开淘宝 App，扫描上方二维码即可。
    </div>
  </div>
</div>

<!-- 数据文件 -->
<script src="data.js"></script>

<script>
  (function() {
    const exams = window.examsData || [];

    if (!exams.length) {
      document.getElementById('quizCard').innerHTML =
        '<p style="text-align:center;color:#ef4444;padding:40px 0;">数据加载失败，请确认 data.js 文件存在且已正确挂载 window.examsData。</p>';
      return;
    }

    let currentIndex = 0;
    const totalExams = exams.length;
    let translationVisible = false;

    const quizCard = document.getElementById('quizCard');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const resetBtn = document.getElementById('resetBtn');
    const pageIndicator = document.getElementById('pageIndicator');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalAnswer = document.getElementById('modalAnswer');
    const modalExplanation = document.getElementById('modalExplanation');
    const modalClose = document.getElementById('modalClose');

    const supportsFieldSizing = CSS.supports('field-sizing', 'content');
    const speechSupported = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

    // ========== 推广弹窗逻辑 ==========
    const PROMO_KEY = 'promo_closed_at';
    const PROMO_INTERVAL = 48 * 60 * 60 * 1000; // 48小时（毫秒）
    const promoOverlay = document.getElementById('promoOverlay');
    const promoClose = document.getElementById('promoClose');

    function isPromoAvailable() {
      try {
        const last = localStorage.getItem(PROMO_KEY);
        if (!last) return true;
        const elapsed = Date.now() - parseInt(last, 10);
        return elapsed >= PROMO_INTERVAL;
      } catch (e) {
        // localStorage 不可用（隐私模式等），直接允许弹出
        return true;
      }
    }

    function markPromoClosed() {
      try {
        localStorage.setItem(PROMO_KEY, Date.now().toString());
      } catch (e) {
        // 忽略
      }
    }

    function showPromo() {
      promoOverlay.classList.add('active');
    }

    function hidePromo() {
      promoOverlay.classList.remove('active');
      markPromoClosed();
    }

    promoClose.addEventListener('click', hidePromo);
    promoOverlay.addEventListener('click', (e) => {
      if (e.target === promoOverlay) {
        hidePromo();
      }
    });

    // 首次访问时延迟 1.5 秒弹出（避免闪屏）
    if (isPromoAvailable()) {
      setTimeout(showPromo, 1500);
    }

    // ========== 语音合成 ==========
    let voicesLoaded = false;
    function loadVoices() {
      if (!speechSupported) return;
      const voices = window.speechSynthesis.getVoices();
      if (voices.length > 0) voicesLoaded = true;
    }
    if (speechSupported) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function pickEnglishVoice() {
      if (!speechSupported) return null;
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return null;
      let voice = voices.find(v => v.lang === 'en-US');
      if (!voice) voice = voices.find(v => v.lang === 'en-GB');
      if (!voice) voice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en'));
      return voice || null;
    }

    function cleanTextForSpeech(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      let text = tmp.textContent || tmp.innerText || '';
      text = text.replace(/\s+/g, ' ').trim();
      return text;
    }

    function speakSentence(text, buttonEl) {
      if (!speechSupported) {
        alert('您的浏览器不支持语音朗读，请使用 Chrome、Edge 或 Safari 浏览器。');
        return;
      }

      window.speechSynthesis.cancel();

      document.querySelectorAll('.speak-btn.speaking').forEach(btn => {
        btn.classList.remove('speaking');
      });

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      utterance.pitch = 1;
      utterance.volume = 1;

      const voice = pickEnglishVoice();
      if (voice) {
        utterance.voice = voice;
        utterance.lang = voice.lang;
      }

      if (buttonEl) {
        buttonEl.classList.add('speaking');
        utterance.onend = () => buttonEl.classList.remove('speaking');
        utterance.onerror = () => buttonEl.classList.remove('speaking');
      }

      setTimeout(() => {
        window.speechSynthesis.speak(utterance);
      }, 50);
    }

    // ========== 渲染逻辑 ==========
    function adjustInputWidth(input) {
      if (supportsFieldSizing) return;
      const span = document.createElement('span');
      span.style.visibility = 'hidden';
      span.style.position = 'absolute';
      span.style.whiteSpace = 'nowrap';
      span.style.font = window.getComputedStyle(input).font;
      span.textContent = input.value || input.placeholder || '';
      document.body.appendChild(span);
      const width = span.getBoundingClientRect().width;
      document.body.removeChild(span);
      input.style.width = Math.max(76, Math.min(width + 30, 220)) + 'px';
    }

    function splitSentences(text) {
      const sentences = [];
      let current = '';
      let depth = 0;
      let i = 0;
      while (i < text.length) {
        const char = text[i];
        if (char === '(') depth++;
        if (char === ')') depth--;
        current += char;
        if (depth === 0 && (char === '.' || char === '?' || char === '!')) {
          const next = text[i + 1];
          if (next === undefined || next === ' ' || next === '"' || next === '</') {
            sentences.push(current.trim());
            current = '';
          }
        }
        i++;
      }
      if (current.trim()) sentences.push(current.trim());
      return sentences.filter(s => s.length > 0);
    }

    function renderNormal(exam) {
      let html = `<div class="exam-title">📄 ${exam.title} <span>完形补文</span>
        <button class="translate-btn" id="translateBtn">🔊 翻译全文</button>
      </div>`;
      html += `<div class="passage">`;

      exam.passage.forEach(para => {
        let processed = para.replace(/(\d+)\s*\(([^)]+)\)/g, (match, num, hint) => {
          return `<input class="blank-input" data-blank="${num}" placeholder="${num}" readonly> (${hint})`;
        });
        html += `<p>${processed}</p>`;
      });

      html += `</div>`;
      quizCard.innerHTML = html;

      bindInputEvents(exam);
      bindTranslateButton(exam);
    }

    function renderTranslation(exam) {
      let html = `<div class="exam-title">📄 ${exam.title} <span>完形补文</span>
        <button class="translate-btn active" id="translateBtn">📖 隐藏翻译</button>
      </div>`;
      html += `<div class="passage">`;

      let transIndex = 0;
      exam.passage.forEach(para => {
        let processed = para.replace(/(\d+)\s*\(([^)]+)\)/g, (match, num, hint) => {
          return `<input class="blank-input" data-blank="${num}" placeholder="${num}" readonly> (${hint})`;
        });

        const sentences = splitSentences(processed);

        sentences.forEach(sentence => {
          let filledSentence = sentence.replace(/<input class="blank-input"[^>]*data-blank="(\d+)"[^>]*>(\s*\([^)]*\))?/g, (match, num) => {
            const answerData = exam.blanks[num];
            if (answerData) {
              return `<span class="filled-answer">${answerData.answer}</span>`;
            }
            return match;
          });
          filledSentence = filledSentence.replace(/\s*\([^)]*\)/g, '');

          const speakText = cleanTextForSpeech(filledSentence);
          const speakTextEscaped = speakText
            .replace(/\\/g, '\\\\')
            .replace(/'/g, "\\'")
            .replace(/"/g, '&quot;');

          const translation = exam.translations[transIndex] || '';

          html += `<div class="sentence-block">`;
          html += `<div class="sentence-en">${filledSentence}<button class="speak-btn" data-speak="${speakTextEscaped}" title="朗读句子" aria-label="朗读句子">🔊</button></div>`;
          if (translation) {
            html += `<div class="sentence-zh">${translation}</div>`;
          }
          html += `</div>`;

          transIndex++;
        });
      });

      html += `</div>`;
      quizCard.innerHTML = html;

      bindSpeakButtons();
      bindTranslateButton(exam);
    }

    function bindSpeakButtons() {
      const buttons = document.querySelectorAll('.speak-btn');
      buttons.forEach(btn => {
        if (!speechSupported) btn.classList.add('unsupported');
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const text = this.getAttribute('data-speak') || '';
          if (!text) return;
          speakSentence(text, this);
        });
      });
    }

    function bindInputEvents(exam) {
      document.querySelectorAll('.blank-input').forEach(input => {
        adjustInputWidth(input);
        input.addEventListener('click', function(e) {
          const blankId = this.dataset.blank;
          const answerData = exam.blanks[blankId];
          if (!answerData) return;

          if (this.classList.contains('revealed')) {
            showModal(answerData.answer, answerData.explanation);
            return;
          }

          this.classList.add('revealed');
          this.value = answerData.answer;
          this.placeholder = answerData.answer;
          adjustInputWidth(this);
        });
      });
    }

    function bindTranslateButton(exam) {
      const translateBtn = document.getElementById('translateBtn');
      if (translateBtn) {
        translateBtn.addEventListener('click', () => {
          if (speechSupported) window.speechSynthesis.cancel();
          translationVisible = !translationVisible;
          if (translationVisible) {
            renderTranslation(exam);
          } else {
            renderNormal(exam);
          }
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }
    }

    function renderExam(index) {
      const exam = exams[index];
      if (!exam) return;

      if (translationVisible) {
        renderTranslation(exam);
      } else {
        renderNormal(exam);
      }

      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === totalExams - 1;
      pageIndicator.textContent = `${index + 1} / ${totalExams}`;
    }

    function showModal(answer, explanation) {
      modalAnswer.textContent = answer;
      modalExplanation.textContent = explanation;
      modalOverlay.classList.add('active');
    }

    function hideModal() {
      modalOverlay.classList.remove('active');
    }

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) {
        if (speechSupported) window.speechSynthesis.cancel();
        currentIndex--;
        renderExam(currentIndex);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentIndex < totalExams - 1) {
        if (speechSupported) window.speechSynthesis.cancel();
        currentIndex++;
        renderExam(currentIndex);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    resetBtn.addEventListener('click', () => {
      if (speechSupported) window.speechSynthesis.cancel();
      translationVisible = false;
      renderExam(currentIndex);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    modalClose.addEventListener('click', hideModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) hideModal();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && speechSupported) {
        window.speechSynthesis.cancel();
      }
    });

    renderExam(currentIndex);
  })();
</script>
</body>
</html>
