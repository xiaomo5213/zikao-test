<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#f3f5f9">
  <title>完形补文 · 在线练习</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background-color: #f3f5f9;
      padding: 16px;
      padding-top: calc(16px + env(safe-area-inset-top));
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #1e293b;
      line-height: 1.6;
    }
    .app-container { max-width: 800px; margin: 0 auto; width: 100%; flex: 1; display: flex; flex-direction: column; }
    .header { margin-bottom: 16px; text-align: center; }
    .header h1 { font-size: 1.5rem; color: #1e293b; font-weight: 600; letter-spacing: -0.01em; }
    .header p { font-size: 0.85rem; color: #64748b; margin-top: 6px; }
    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04), 0 2px 4px rgba(0, 0, 0, 0.02);
      padding: 20px 16px;
      margin-bottom: 16px;
      transition: all 0.2s;
    }

    /* ===== 标题行：标题 + 控制区（翻译按钮 + 音色下拉框） ===== */
    .exam-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .exam-title .title-text {
      flex: 1;
      min-width: 0;
    }
    .exam-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-left: auto;
    }
    .exam-title .translate-btn {
      background: #10b981;
      color: white;
      border: none;
      font-size: 0.85rem;
      padding: 8px 16px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 36px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .exam-title .translate-btn:hover { background: #059669; }
    .exam-title .translate-btn.active { background: #f59e0b; }
    .exam-title .translate-btn.active:hover { background: #d97706; }

    /* ===== 音色选择下拉框 ===== */
    .voice-select {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 8px 30px 8px 12px;
      border-radius: 30px;
      font-size: 0.85rem;
      color: #1e293b;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%231e293b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 9px;
      max-width: 170px;
      min-height: 36px;
    }
    .voice-select:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }

    .passage { font-size: 1rem; line-height: 1.9; color: #1e293b; word-break: break-word; overflow-wrap: break-word; }
    .passage p { margin-bottom: 16px; text-align: justify; }

    .sentence-block { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px dashed #e2e8f0; }
    .sentence-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .sentence-en {
      text-align: justify;
      margin-bottom: 8px;
      font-size: 1rem;
      line-height: 1.9;
      color: #0f172a;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .speak-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      margin-left: 6px;
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 50%;
      border: 1px solid #dbeafe;
      background: #eff6ff;
      color: #2563eb;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      padding: 0;
      line-height: 1;
    }
    .speak-btn:hover { background: #dbeafe; border-color: #93c5fd; }
    .speak-btn:active { transform: scale(0.9); background: #bfdbfe; }
    .speak-btn.speaking { background: #3b82f6; color: white; border-color: #3b82f6; animation: pulse 1.2s ease-in-out infinite; }
    .speak-btn.loading { background: #fef3c7; border-color: #fcd34d; color: #92400e; animation: pulse 1.2s ease-in-out infinite; }
    .speak-btn.unsupported { opacity: 0.4; cursor: not-allowed; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

    .sentence-zh {
      color: #475569;
      font-size: 0.9rem;
      line-height: 1.7;
      padding: 10px 14px;
      border-left: 3px solid #10b981;
      background: #f0fdf4;
      border-radius: 6px;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .filled-answer { color: #dc2626; font-weight: 700; background: #fef2f2; padding: 0 4px; border-radius: 4px; }

    .blank-input {
      display: inline-block;
      width: auto;
      min-width: 76px;
      max-width: 220px;
      padding: 6px 10px;
      margin: 0 3px;
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 500;
      color: #2563eb;
      background: #f1f5f9;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      text-align: center;
      outline: none;
      transition: all 0.2s;
      cursor: pointer;
      vertical-align: middle;
      field-sizing: content;
      -webkit-appearance: none;
      appearance: none;
    }
    .blank-input::placeholder { color: #94a3b8; font-weight: 400; opacity: 0.8; }
    .blank-input:hover { border-color: #3b82f6; background: #e2e8f0; }
    .blank-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); background: #ffffff; }
    .blank-input.revealed { background: #dbeafe; border-color: #3b82f6; color: #1e40af; font-weight: 600; cursor: pointer; field-sizing: content; }
    .blank-input.revealed::placeholder { color: #1e40af; opacity: 1; }

    .nav-buttons { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .btn {
      background: white;
      border: 1px solid #cbd5e1;
      padding: 12px 16px;
      border-radius: 40px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #1e293b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      flex: 1;
      min-width: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      min-height: 46px;
    }
    .btn:hover { background: #f8fafc; border-color: #94a3b8; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; pointer-events: none; filter: grayscale(0.5); }
    .btn-reset { background: #fef2f2; border-color: #fca5a5; color: #b91c1c; flex: 0 0 auto; min-width: 90px; }
    .btn-reset:hover { background: #fee2e2; border-color: #ef4444; }
    .page-indicator {
      font-size: 0.85rem;
      color: #475569;
      background: #e2e8f0;
      padding: 10px 14px;
      border-radius: 40px;
      font-weight: 500;
      white-space: nowrap;
      text-align: center;
      min-width: 70px;
      order: 3;
      flex: 1 1 100%;
    }

    /* ===== 弹窗 ===== */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 16px;
      visibility: hidden; opacity: 0;
      transition: opacity 0.2s, visibility 0.2s;
    }
    .modal-overlay.active { visibility: visible; opacity: 1; }
    .modal-content {
      background: white; border-radius: 24px;
      max-width: 500px; width: 100%;
      padding: 24px 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      position: relative;
      transform: scale(0.96); transition: transform 0.2s;
      max-height: 80vh; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .modal-overlay.active .modal-content { transform: scale(1); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-header h3 { font-size: 1.25rem; font-weight: 700; color: #0f172a; }
    .modal-close {
      background: none; border: none;
      font-size: 1.8rem; line-height: 1;
      color: #94a3b8; cursor: pointer;
      padding: 0 8px; transition: color 0.2s;
      min-width: 40px; min-height: 40px;
    }
    .modal-close:hover { color: #1e293b; }
    .modal-answer { font-size: 1.8rem; font-weight: 700; color: #2563eb; margin: 10px 0 16px; letter-spacing: 0.5px; word-break: break-word; }
    .modal-explanation {
      background: #f8fafc; padding: 16px; border-radius: 16px;
      font-size: 0.95rem; line-height: 1.7; color: #1e293b;
      white-space: pre-wrap; word-break: break-word;
    }

    /* ===== 推广弹窗 ===== */
    .promo-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      z-index: 2000; padding: 20px;
      visibility: hidden; opacity: 0;
      transition: opacity 0.25s, visibility 0.25s;
    }
    .promo-overlay.active { visibility: visible; opacity: 1; }
    .promo-content {
      background: #ffffff; border-radius: 24px;
      max-width: 380px; width: 100%;
      padding: 28px 22px 22px;
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.35);
      position: relative;
      transform: scale(0.92); transition: transform 0.25s;
      text-align: center;
    }
    .promo-overlay.active .promo-content { transform: scale(1); }
    .promo-close {
      position: absolute; top: 10px; right: 12px;
      background: rgba(148, 163, 184, 0.15);
      border: none; width: 36px; height: 36px;
      border-radius: 50%; font-size: 1.4rem; line-height: 1;
      color: #64748b; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; -webkit-tap-highlight-color: transparent;
    }
    .promo-close:hover { background: rgba(148, 163, 184, 0.3); color: #1e293b; }
    .promo-close:active { transform: scale(0.9); }
    .promo-badge {
      display: inline-block;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: white; font-size: 0.75rem; font-weight: 600;
      padding: 4px 14px; border-radius: 30px;
      margin-bottom: 12px; letter-spacing: 0.5px;
    }
    .promo-title { font-size: 1.25rem; font-weight: 700; color: #0f172a; margin-bottom: 8px; letter-spacing: -0.01em; }
    .promo-desc { font-size: 0.9rem; color: #475569; line-height: 1.6; margin-bottom: 18px; }
    .promo-desc strong { color: #dc2626; font-weight: 700; }
    .promo-qrcode-wrap {
      background: #f8fafc; border: 1px dashed #cbd5e1;
      border-radius: 16px; padding: 14px; margin-bottom: 18px;
      display: flex; justify-content: center; align-items: center;
    }
    .promo-qrcode { display: block; width: 100%; max-width: 220px; height: auto; border-radius: 10px; }
    .promo-qrcode-fallback {
      width: 100%; max-width: 220px; height: 220px;
      display: flex; align-items: center; justify-content: center;
      color: #94a3b8; font-size: 0.85rem;
      background: #f1f5f9; border-radius: 10px;
      text-align: center; padding: 20px;
    }
    .promo-tips {
      font-size: 0.8rem; color: #64748b;
      background: #eff6ff; border-radius: 10px;
      padding: 10px 14px; line-height: 1.6;
      text-align: left; border-left: 3px solid #3b82f6;
    }
    .promo-tips strong { color: #2563eb; }

    .footer-note { text-align: center; font-size: 0.75rem; color: #94a3b8; margin-top: 8px; padding: 8px 0; }

    /* ===== 手机端适配 ===== */
    @media (max-width: 480px) {
      body { padding: 12px; padding-top: calc(12px + env(safe-area-inset-top)); padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
      .header h1 { font-size: 1.3rem; }
      .header p { font-size: 0.8rem; }
      .card { padding: 16px 12px; border-radius: 16px; }
      .exam-title { font-size: 1rem; gap: 6px; }
      .exam-title .translate-btn { font-size: 0.8rem; padding: 7px 14px; min-height: 34px; }
      .voice-select { font-size: 0.8rem; padding: 7px 28px 7px 10px; min-height: 34px; max-width: 140px; }
      .passage { font-size: 0.95rem; line-height: 1.85; }
      .sentence-en { font-size: 0.95rem; line-height: 1.85; }
      .sentence-zh { font-size: 0.87rem; padding: 9px 12px; }
      .blank-input { min-width: 64px; max-width: 180px; padding: 5px 8px; font-size: 0.9rem; }
      .speak-btn { width: 30px; height: 30px; min-width: 30px; font-size: 0.9rem; margin-left: 5px; }
      .btn { padding: 10px 14px; font-size: 0.9rem; min-height: 44px; }
      .btn-reset { min-width: 80px; }
      .page-indicator { font-size: 0.8rem; padding: 8px 12px; }
      .modal-content { padding: 20px 16px; }
      .modal-answer { font-size: 1.5rem; }
      .modal-explanation { font-size: 0.9rem; padding: 14px; }
      .promo-content { padding: 24px 18px 18px; border-radius: 20px; }
      .promo-title { font-size: 1.15rem; }
      .promo-desc { font-size: 0.85rem; }
      .promo-qrcode { max-width: 200px; }
      .promo-qrcode-fallback { max-width: 200px; height: 200px; }
      .promo-tips { font-size: 0.75rem; padding: 9px 12px; }
      /* 手机端：标题行换行，控制区占满宽度 */
      .exam-title { flex-direction: column; align-items: stretch; }
      .exam-controls { width: 100%; justify-content: flex-start; margin-left: 0; }
      .voice-select { flex: 1; max-width: none; }
    }
    @media (max-width: 360px) {
      .exam-title .translate-btn { margin-left: 0; width: 100%; justify-content: center; margin-top: 8px; }
      .nav-buttons { flex-direction: column; }
      .btn, .btn-reset { width: 100%; max-width: none; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <h1>📘 完形补文 · 在线练习</h1>
    <p>点击输入框查看答案 · 点击翻译显示中文 · 点击 🔊 朗读英文</p>
  </div>

  <div id="quizCard" class="card">
    <!-- 动态渲染 -->
  </div>

  <div class="nav-buttons">
    <button id="prevBtn" class="btn" disabled>← 上一页</button>
    <button id="resetBtn" class="btn btn-reset">↺ 重置</button>
    <span id="pageIndicator" class="page-indicator">1 / 26</span>
    <button id="nextBtn" class="btn">下一页 →</button>
  </div>
  <div class="footer-note">基于2013-2026年自考英语(二)完形补文真题</div>
</div>

<!-- 答案解析弹窗 -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h3>💡 答案解析</h3>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-answer" id="modalAnswer">answer</div>
    <div class="modal-explanation" id="modalExplanation">解析内容</div>
  </div>
</div>

<!-- 推广弹窗 -->
<div id="promoOverlay" class="promo-overlay">
  <div class="promo-content">
    <button class="promo-close" id="promoClose" aria-label="关闭">&times;</button>
    <div class="promo-badge">限时优惠</div>
    <h3 class="promo-title">获取电子版资料</h3>
    <p class="promo-desc">扫码在淘宝购买，<strong>一次购买，永久免费更新</strong>！</p>
    <div class="promo-qrcode-wrap">
      <img src="12.jpg" alt="淘宝购买二维码" class="promo-qrcode" id="promoQrcode"
           onerror="this.style.display='none'; document.getElementById('promoQrcodeFallback').style.display='flex';">
      <div class="promo-qrcode-fallback" id="promoQrcodeFallback" style="display:none;">
        二维码图片加载失败<br>请检查 12.jpg 是否已上传
      </div>
    </div>
    <div class="promo-tips">
      <strong>📦 包含内容：</strong>全部真题 PDF、完形补文详解、答题技巧整理。<br>
      <strong>💡 购买方式：</strong>打开淘宝 App，扫描上方二维码即可。
    </div>
  </div>
</div>

<script src="data.js"></script>

<script>
  (function() {
    // ========== 配置 TTS Worker ==========
    const TTS_WORKER_URL = 'https://api.xiemojy.mom/v1/audio/speech';
    const DEFAULT_VOICE = 'en-US-JennyNeural';
    const VOICE_STORAGE_KEY = 'tts_voice_preference_wanxing';

    // ========== 音色持久化 ==========
    function loadVoicePreference() {
      try {
        const saved = localStorage.getItem(VOICE_STORAGE_KEY);
        return saved || DEFAULT_VOICE;
      } catch (e) {
        return DEFAULT_VOICE;
      }
    }
    function saveVoicePreference(v) {
      try { localStorage.setItem(VOICE_STORAGE_KEY, v); } catch (e) {}
    }

    // ========== 音频对象复用 ==========
    let globalAudio = null;
    let currentSpeakBtn = null;
    let audioUnlocked = false;

    function getGlobalAudio() {
      if (!globalAudio) {
        globalAudio = new Audio();
        globalAudio.preload = 'auto';
        globalAudio.setAttribute('playsinline', 'true');
        globalAudio.setAttribute('webkit-playsinline', 'true');
      }
      return globalAudio;
    }

    function stopSpeech() {
      if (globalAudio) {
        try {
          globalAudio.pause();
          globalAudio.currentTime = 0;
        } catch (e) {}
      }
      if (currentSpeakBtn) {
        currentSpeakBtn.classList.remove('speaking');
        currentSpeakBtn.classList.remove('loading');
        currentSpeakBtn = null;
      }
    }

    // ========== iOS 微信音频解锁 ==========
    function unlockIOSAudio() {
      try {
        const silent = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
        silent.volume = 0;
        silent.play().catch(() => {});
      } catch (e) {}
    }

    // ========== 朗读函数（走 Worker） ==========
    async function speakSentence(text, buttonEl) {
      if (!text) return;

      // 同一个按钮再次点击 => 停止
      if (currentSpeakBtn === buttonEl && globalAudio && !globalAudio.paused) {
        stopSpeech();
        return;
      }

      stopSpeech();

      if (buttonEl) {
        buttonEl.classList.add('loading');
        currentSpeakBtn = buttonEl;
      }

      try {
        const voice = loadVoicePreference();
        const response = await fetch(TTS_WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            input: text,
            voice: voice,
            speed: 0.95
          })
        });

        if (!response.ok) throw new Error('TTS 请求失败: ' + response.status);

        const arrayBuffer = await response.arrayBuffer();
        const blob = new Blob([arrayBuffer], { type: 'audio/mpeg' });
        const audioUrl = URL.createObjectURL(blob);
        const audio = getGlobalAudio();
        audio.src = audioUrl;

        if (buttonEl) {
          buttonEl.classList.remove('loading');
          buttonEl.classList.add('speaking');
        }

        audio.onended = null;
        audio.onerror = null;

        audio.onended = () => {
          if (buttonEl) buttonEl.classList.remove('speaking');
          if (currentSpeakBtn === buttonEl) currentSpeakBtn = null;
          URL.revokeObjectURL(audioUrl);
        };
        audio.onerror = () => {
          if (buttonEl) buttonEl.classList.remove('speaking');
          if (currentSpeakBtn === buttonEl) currentSpeakBtn = null;
          URL.revokeObjectURL(audioUrl);
        };

        try {
          await audio.play();
          audioUnlocked = true;
        } catch (playErr) {
          console.error('播放失败:', playErr);
          if (buttonEl) buttonEl.classList.remove('speaking');
          currentSpeakBtn = null;
          URL.revokeObjectURL(audioUrl);
          if (!audioUnlocked) {
            alert('请再点击一次发音按钮（微信需激活音频权限）');
          }
        }
      } catch (err) {
        console.error('TTS 播放失败:', err);
        if (buttonEl) {
          buttonEl.classList.remove('loading');
          buttonEl.classList.remove('speaking');
        }
        if (currentSpeakBtn === buttonEl) currentSpeakBtn = null;
        alert('语音播放失败：' + err.message);
      }
    }

    // ========== 业务逻辑 ==========
    const exams = window.examsData || [];

    if (!exams.length) {
      document.getElementById('quizCard').innerHTML =
        '<p style="text-align:center;color:#ef4444;padding:40px 0;">数据加载失败，请确认 data.js 文件存在且已正确挂载 window.examsData。</p>';
      return;
    }

    let currentIndex = 0;
    const totalExams = exams.length;
    let translationVisible = false;

    const quizCard = document.getElementById('quizCard');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const resetBtn = document.getElementById('resetBtn');
    const pageIndicator = document.getElementById('pageIndicator');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalAnswer = document.getElementById('modalAnswer');
    const modalExplanation = document.getElementById('modalExplanation');
    const modalClose = document.getElementById('modalClose');

    const supportsFieldSizing = CSS.supports('field-sizing', 'content');

    // 清理 HTML 得到纯文本
    function cleanTextForSpeech(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      let text = tmp.textContent || tmp.innerText || '';
      text = text.replace(/\s+/g, ' ').trim();
      return text;
    }

    function splitLongTextForSpeech(text, maxLen) {
      maxLen = maxLen || 200;
      if (text.length <= maxLen) return [text];
      const chunks = [];
      const parts = text.split(/(?<=[.?!])\s+/);
      let buf = '';
      for (const p of parts) {
        if ((buf + ' ' + p).trim().length > maxLen && buf) {
          chunks.push(buf.trim());
          buf = p;
        } else {
          buf = (buf + ' ' + p).trim();
        }
      }
      if (buf) chunks.push(buf.trim());
      const finalChunks = [];
      for (const c of chunks) {
        if (c.length <= maxLen) {
          finalChunks.push(c);
        } else {
          for (let i = 0; i < c.length; i += maxLen) {
            finalChunks.push(c.slice(i, i + maxLen));
          }
        }
      }
      return finalChunks;
    }

    // ========== 推广弹窗逻辑 ==========
    const PROMO_KEY = 'promo_closed_at';
    const PROMO_INTERVAL = 48 * 60 * 60 * 1000;
    const promoOverlay = document.getElementById('promoOverlay');
    const promoClose = document.getElementById('promoClose');

    function isPromoAvailable() {
      try {
        const last = localStorage.getItem(PROMO_KEY);
        if (!last) return true;
        const elapsed = Date.now() - parseInt(last, 10);
        return elapsed >= PROMO_INTERVAL;
      } catch (e) {
        return true;
      }
    }
    function markPromoClosed() {
      try { localStorage.setItem(PROMO_KEY, Date.now().toString()); } catch (e) {}
    }
    function showPromo() { promoOverlay.classList.add('active'); }
    function hidePromo() { promoOverlay.classList.remove('active'); markPromoClosed(); }

    promoClose.addEventListener('click', hidePromo);
    promoOverlay.addEventListener('click', (e) => {
      if (e.target === promoOverlay) hidePromo();
    });

    if (isPromoAvailable()) {
      setTimeout(showPromo, 1500);
    }

    // ========== 渲染 ==========
    function adjustInputWidth(input) {
      if (supportsFieldSizing) return;
      const span = document.createElement('span');
      span.style.visibility = 'hidden';
      span.style.position = 'absolute';
      span.style.whiteSpace = 'nowrap';
      span.style.font = window.getComputedStyle(input).font;
      span.textContent = input.value || input.placeholder || '';
      document.body.appendChild(span);
      const width = span.getBoundingClientRect().width;
      document.body.removeChild(span);
      input.style.width = Math.max(76, Math.min(width + 30, 220)) + 'px';
    }

    function splitSentences(text) {
      const sentences = [];
      let current = '';
      let depth = 0;
      let i = 0;
      while (i < text.length) {
        const char = text[i];
        if (char === '(') depth++;
        if (char === ')') depth--;
        current += char;
        if (depth === 0 && (char === '.' || char === '?' || char === '!')) {
          const next = text[i + 1];
          if (next === undefined || next === ' ' || next === '"' || next === '</') {
            sentences.push(current.trim());
            current = '';
          }
        }
        i++;
      }
      if (current.trim()) sentences.push(current.trim());
      return sentences.filter(s => s.length > 0);
    }

    function renderNormal(exam) {
      let html = `<div class="exam-title">
        <span class="title-text">📄 ${exam.title}</span>
        <div class="exam-controls">
          <button class="translate-btn" id="translateBtn">🔊 翻译全文</button>
          <select class="voice-select" id="voiceSelect" style="display:none;" title="选择发音音色">
            <option value="en-US-JennyNeural">👩 美式女声 Jenny</option>
            <option value="en-US-AriaNeural">👩 美式女声 Aria</option>
            <option value="en-US-GuyNeural">👨 美式男声 Guy</option>
            <option value="en-GB-SoniaNeural">👩 英式女声 Sonia</option>
            <option value="en-GB-RyanNeural">👨 英式男声 Ryan</option>
            <option value="en-AU-NatashaNeural">👩 澳式女声 Natasha</option>
          </select>
        </div>
      </div>`;
      html += `<div class="passage">`;

      exam.passage.forEach(para => {
        let processed = para.replace(/(\d+)\s*\(([^)]+)\)/g, (match, num, hint) => {
          return `<input class="blank-input" data-blank="${num}" placeholder="${num}" readonly> (${hint})`;
        });
        html += `<p>${processed}</p>`;
      });

      html += `</div>`;
      quizCard.innerHTML = html;

      bindInputEvents(exam);
      bindTranslateButton(exam);
    }

    function renderTranslation(exam) {
      let html = `<div class="exam-title">
        <span class="title-text">📄 ${exam.title}</span>
        <div class="exam-controls">
          <button class="translate-btn active" id="translateBtn">📖 隐藏翻译</button>
          <select class="voice-select" id="voiceSelect" title="选择发音音色">
            <option value="en-US-JennyNeural">👩 美式女声 Jenny</option>
            <option value="en-US-AriaNeural">👩 美式女声 Aria</option>
            <option value="en-US-GuyNeural">👨 美式男声 Guy</option>
            <option value="en-GB-SoniaNeural">👩 英式女声 Sonia</option>
            <option value="en-GB-RyanNeural">👨 英式男声 Ryan</option>
            <option value="en-AU-NatashaNeural">👩 澳式女声 Natasha</option>
          </select>
        </div>
      </div>`;
      html += `<div class="passage">`;

      let transIndex = 0;
      exam.passage.forEach(para => {
        let processed = para.replace(/(\d+)\s*\(([^)]+)\)/g, (match, num, hint) => {
          return `<input class="blank-input" data-blank="${num}" placeholder="${num}" readonly> (${hint})`;
        });

        const sentences = splitSentences(processed);

        sentences.forEach(sentence => {
          let filledSentence = sentence.replace(/<input class="blank-input"[^>]*data-blank="(\d+)"[^>]*>(\s*\([^)]*\))?/g, (match, num) => {
            const answerData = exam.blanks[num];
            if (answerData) {
              return `<span class="filled-answer">${answerData.answer}</span>`;
            }
            return match;
          });
          filledSentence = filledSentence.replace(/\s*\([^)]*\)/g, '');

          const speakText = cleanTextForSpeech(filledSentence);
          const speakTextEscaped = speakText
            .replace(/\\/g, '\\\\')
            .replace(/'/g, "\\'")
            .replace(/"/g, '&quot;');

          const translation = exam.translations[transIndex] || '';

          html += `<div class="sentence-block">`;
          html += `<div class="sentence-en">${filledSentence}<button class="speak-btn" data-speak="${speakTextEscaped}" title="朗读句子" aria-label="朗读句子">🔊</button></div>`;
          if (translation) {
            html += `<div class="sentence-zh">${translation}</div>`;
          }
          html += `</div>`;

          transIndex++;
        });
      });

      html += `</div>`;
      quizCard.innerHTML = html;

      // 恢复音色选择
      const voiceSelect = document.getElementById('voiceSelect');
      if (voiceSelect) {
        voiceSelect.value = loadVoicePreference();
        voiceSelect.addEventListener('change', () => {
          saveVoicePreference(voiceSelect.value);
        });
      }

      bindSpeakButtons();
      bindTranslateButton(exam);
    }

    function bindSpeakButtons() {
      const buttons = document.querySelectorAll('.speak-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          e.preventDefault();
          const text = this.getAttribute('data-speak') || '';
          if (!text) return;
          speakSentence(text, this);
        });
      });
    }

    function bindInputEvents(exam) {
      document.querySelectorAll('.blank-input').forEach(input => {
        adjustInputWidth(input);
        input.addEventListener('click', function(e) {
          const blankId = this.dataset.blank;
          const answerData = exam.blanks[blankId];
          if (!answerData) return;

          if (this.classList.contains('revealed')) {
            showModal(answerData.answer, answerData.explanation);
            return;
          }

          this.classList.add('revealed');
          this.value = answerData.answer;
          this.placeholder = answerData.answer;
          adjustInputWidth(this);
        });
      });
    }

    function bindTranslateButton(exam) {
      const translateBtn = document.getElementById('translateBtn');
      if (translateBtn) {
        translateBtn.addEventListener('click', () => {
          stopSpeech();
          translationVisible = !translationVisible;
          if (translationVisible) {
            renderTranslation(exam);
          } else {
            renderNormal(exam);
          }
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }
    }

    function renderExam(index) {
      const exam = exams[index];
      if (!exam) return;

      if (translationVisible) {
        renderTranslation(exam);
      } else {
        renderNormal(exam);
      }

      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === totalExams - 1;
      pageIndicator.textContent = `${index + 1} / ${totalExams}`;
    }

    function showModal(answer, explanation) {
      modalAnswer.textContent = answer;
      modalExplanation.textContent = explanation;
      modalOverlay.classList.add('active');
    }

    function hideModal() {
      modalOverlay.classList.remove('active');
    }

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) {
        stopSpeech();
        currentIndex--;
        renderExam(currentIndex);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentIndex < totalExams - 1) {
        stopSpeech();
        currentIndex++;
        renderExam(currentIndex);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    resetBtn.addEventListener('click', () => {
      stopSpeech();
      translationVisible = false;
      renderExam(currentIndex);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    modalClose.addEventListener('click', hideModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) hideModal();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopSpeech();
    });

    // 页面加载后解锁 iOS 音频
    unlockIOSAudio();

    renderExam(currentIndex);
  })();
</script>
</body>
</html>
